<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DramaClaw</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b14;
    color: white;
}

header {
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111122;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
}

.hero {
    padding: 70px 7%;
    text-align: center;
    background: linear-gradient(135deg, #17172e, #30154f);
}

.hero h1 {
    font-size: 52px;
    margin-bottom: 15px;
}

.hero p {
    color: #d5d5df;
    font-size: 18px;
}

section {
    padding: 55px 7%;
}

section h2 {
    font-size: 32px;
    margin-bottom: 25px;
}

.character-group {
    margin-bottom: 45px;
}

.character-group h3 {
    font-size: 24px;
    margin-bottom: 18px;
}

.characters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.character {
    background: #171725;
    border-radius: 15px;
    padding: 15px;
    overflow: hidden;
}

.character img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 10px;
    background: #252535;
}

.character h4 {
    font-size: 20px;
    margin-top: 15px;
}

.character p {
    color: #aaaabb;
    margin-top: 7px;
}

footer {
    padding: 30px 7%;
    text-align: center;
    background: #111122;
    color: #888899;
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 DramaClaw</div>

    <nav>
        <a href="#">Home</a>
